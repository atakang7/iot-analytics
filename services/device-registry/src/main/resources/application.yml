server:
  port: 8080

spring:
  application:
    name: device-registry
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:iot}
    username: ${DB_USER:iot}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  server:
    port: 9090
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
