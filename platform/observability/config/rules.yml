groups:
  - name: iot-service-health
    rules:
      - alert: IoTIngestionUnavailable
        expr: absent(up{job="ingestion"} == 1)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Ingestion has no healthy Prometheus scrape target"
      - alert: IoTStreamWorkerUnavailable
        expr: absent(up{job="stream-worker"} == 1)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Stream worker has no healthy Prometheus scrape target"
