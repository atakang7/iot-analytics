# Namespace-scoped log API access. No ClusterRole, no hostPath and no secrets access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iot-log-collector
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: iot-log-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: iot-log-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: iot-log-reader
subjects:
  - kind: ServiceAccount
    name: iot-log-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-log-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iot-log-collector
  template:
    metadata:
      labels:
        app: iot-log-collector
    spec:
      serviceAccountName: iot-log-collector
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: iot/log-collector:kind
          imagePullPolicy: Never
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOKI_PUSH_URL
              value: http://loki.iot-observability.svc.cluster.local:3100/loki/api/v1/push
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
