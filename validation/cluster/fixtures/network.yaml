apiVersion: v1
kind: Pod
metadata:
  name: server
  labels:
    app: network-proof-server
spec:
  nodeSelector:
    kubernetes.io/hostname: iot-foundation-worker
  containers:
    - name: server
      image: hashicorp/http-echo:1.0.0
      args:
        - -listen=:5678
        - -text=iot-cross-node-proof
      ports:
        - containerPort: 5678
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: network-proof-server
  ports:
    - port: 5678
      targetPort: 5678
---
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  nodeSelector:
    kubernetes.io/hostname: iot-foundation-worker2
  containers:
    - name: client
      image: curlimages/curl:8.13.0
      command: ["sh", "-c", "sleep 900"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
