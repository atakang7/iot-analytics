apiVersion: v1
kind: Pod
metadata:
  name: storage-reader
spec:
  nodeSelector:
    kubernetes.io/hostname: iot-foundation-worker
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "test \"$(cat /data/marker)\" = durable-cluster-proof && sleep 900"]
      volumeMounts:
        - name: proof
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
  volumes:
    - name: proof
      persistentVolumeClaim:
        claimName: persistent-proof
