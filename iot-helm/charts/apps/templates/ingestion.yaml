{{- if eq .Values.imageMode "lab" }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ingestion
  labels:
    app: ingestion
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ingestion
  labels:
    app: ingestion
spec:
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  output:
    to:
      kind: ImageStreamTag
      name: ingestion:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy: 
      dockerfilePath: Dockerfile
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    app: ingestion
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ingestion
  template:
    metadata:
      labels:
        app: ingestion
        app.kubernetes.io/part-of: iot-analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion
          image: {{ include "iot.image" (dict "name" "ingestion" "values" .Values) | quote }}
          imagePullPolicy: {{ if eq .Values.imageMode "kind" }}Never{{ else if eq .Values.imageMode "release" }}IfNotPresent{{ else }}Always{{ end }}
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
          ports:
            - containerPort: 8081
              name: http
            - containerPort: 9090
              name: management
          env:
            - name: KAFKA_BOOTSTRAP
              value: {{ .Values.kafkaBootstrap | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 5
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  labels:
    app: ingestion
spec:
  selector:
    app: ingestion
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9090
      targetPort: management
{{- if .Values.routes.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ingestion
  labels:
    app: ingestion
spec:
  to:
    kind: Service
    name: ingestion
  port:
    targetPort: 8081
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
