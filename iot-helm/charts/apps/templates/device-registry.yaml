{{- if eq .Values.imageMode "lab" }}
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: device-registry
  labels:
    app: device-registry
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: device-registry
  labels:
    app: device-registry
spec:
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
  output:
    to:
      kind: ImageStreamTag
      name: device-registry:latest
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy: 
      dockerfilePath: Dockerfile
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: device-registry
  labels:
    app: device-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: device-registry
  template:
    metadata:
      labels:
        app: device-registry
        app.kubernetes.io/part-of: iot-analytics
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Values.dbHost }} 5432; do echo waiting for db; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: device-registry
          image: {{ include "iot.image" (dict "name" "device-registry" "values" .Values) | quote }}
          imagePullPolicy: {{ if eq .Values.imageMode "kind" }}Never{{ else if eq .Values.imageMode "release" }}IfNotPresent{{ else }}Always{{ end }}
          securityContext:
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-tmp
              mountPath: /tmp
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: management
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ printf "jdbc:postgresql://%s:5432/iot" .Values.dbHost | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: iot-central-secret
                  key: timescaledb_user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iot-central-secret
                  key: timescaledb_password
            - name: JAVA_TOOL_OPTIONS
              value: "-Xms256m -Xmx512m"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9090
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: runtime-tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: device-registry
  labels:
    app: device-registry
spec:
  selector:
    app: device-registry
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: management
  type: ClusterIP
{{- if .Values.routes.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: device-registry
  labels:
    app: device-registry
spec:
  to:
    kind: Service
    name: device-registry
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
