apiVersion: v2
name: iot-analytics
description: IoT Analytics OpenShift lab
version: 1.0.0
appVersion: "1.0.0"

dependencies:
  - name: infra
    version: "1.0.0"
    repository: "file://charts/infra"
    condition: infra.enabled
  - name: apps
    version: "1.0.0"
    repository: "file://charts/apps"
    condition: apps.enabled
  - name: monitoring
    version: "1.0.0"
    repository: "file://charts/monitoring"
    condition: monitoring.enabled
