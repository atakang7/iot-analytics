name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python syntax and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest==8.3.4 kafka-python==2.0.2 psycopg2-binary==2.9.9 prometheus-client==0.19.0 ruff==0.8.6
      - name: Compile and check correctness
        run: |
          python -m compileall -q services/workers
          ruff check --select E4,E7,E9,F63,F7,F82 services/workers
      - name: Test every worker
        env:
          DB_PASSWORD: ci-test-placeholder
        run: |
          set -euo pipefail
          for worker in telemetry-worker stream-worker alert-worker kpi-job; do
            echo "::group::${worker} tests"
            (cd "services/workers/${worker}" && PYTHONPATH=.. python -m pytest -q)
            echo "::endgroup::"
          done

  java:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify both services
        run: |
          set -euo pipefail
          for service in ingestion device-registry; do
            mvn -B -ntp -f "services/${service}/pom.xml" verify
          done

  containers:
    name: Container build and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          IOT_DB_PASSWORD: ci-test-placeholder
        run: docker compose -f services/docker-compose.yml config -q
      - name: Build all service images
        run: |
          set -euo pipefail
          for service in ingestion device-registry; do
            docker build -t "iot/${service}:ci" "services/${service}"
          done
          for worker in telemetry-worker stream-worker alert-worker kpi-job; do
            docker build -t "iot/${worker}:ci" -f "services/workers/${worker}/Dockerfile" services/workers
          done

  helm:
    name: Helm chart validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4
      - name: Validate chart
        run: |
          helm dependency build iot-helm
          helm lint iot-helm -f iot-helm/values-dev.yaml
          helm template iot-analytics iot-helm -f iot-helm/values-dev.yaml > /tmp/iot-rendered.yaml
          test -s /tmp/iot-rendered.yaml

  database:
    name: TimescaleDB initialization and replay invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IOT_DB_PASSWORD: ci-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Verify schema copies are identical
        run: |
          cmp services/schema.sql iot-helm/charts/infra/configs/schema.sql
          cmp services/schema.sql iot-helm/charts/monitoring/configs/schema.sql
      - name: Start real TimescaleDB
        run: docker compose -f services/docker-compose.yml up -d timescaledb
      - name: Wait for initialized schema
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if docker compose -f services/docker-compose.yml exec -T timescaledb \
                psql -U iot -d iot -v ON_ERROR_STOP=1 -Atc \
                "SELECT 1 FROM information_schema.tables WHERE table_name='job_watermarks'" 2>/dev/null | grep -q '^1$'; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f services/docker-compose.yml logs timescaledb
          exit 1
      - name: Verify SQL constraints and replay behavior
        run: |
          docker compose -f services/docker-compose.yml exec -T timescaledb \
            psql -U iot -d iot -v ON_ERROR_STOP=1 < scripts/verify-schema.sql
      - name: Database logs
        if: failure()
        run: docker compose -f services/docker-compose.yml logs timescaledb

  e2e:
    name: End-to-end APIs, Kafka, alerts and KPI job
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IOT_DB_PASSWORD: ci-test-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch real services
        run: |
          docker compose -f services/docker-compose.yml up -d --build \
            timescaledb kafka ingestion device-registry telemetry-worker stream-worker alert-worker
      - name: Exercise device API and full data flow
        run: bash scripts/smoke-local.sh
      - name: Inspect stack on failure
        if: failure()
        run: |
          docker compose -f services/docker-compose.yml ps -a
          docker compose -f services/docker-compose.yml logs --tail=250
      - name: Shut down test stack
        if: always()
        run: docker compose -f services/docker-compose.yml down -v --remove-orphans
