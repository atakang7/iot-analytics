name: Publish immutable OCI release

on:
  workflow_dispatch:

# No writes on PRs. Dispatching outside main is rejected by the first job.
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  verify-source:
    name: Require green main CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check source revision and prior verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&event=push&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Verify" and .conclusion == "success")] | length')"
          test "$count" -ge 1

  publish:
    name: Scan, publish and sign ${{ matrix.service }}
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - ingestion
          - device-registry
          - telemetry-worker
          - stream-worker
          - alert-worker
          - kpi-job
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Install exact-copy transport
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
      - name: Scan OCI, preserve digest at GHCR, sign and verify
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: bash delivery/bin/publish-image "${{ matrix.service }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: published-${{ matrix.service }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/iot-publish/${{ matrix.service }}.identity.json
            ${{ runner.temp }}/iot-publish/${{ matrix.service }}.sbom.json

  assemble:
    name: Verify complete six-image release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - name: Validate and assemble release artifact
        run: |
          python3 delivery/assemble.py --identity-dir published --output release.json
          python3 delivery/release.py validate release.json
          python3 delivery/release.py helm-values release.json --output release-values.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: immutable-release
          if-no-files-found: error
          retention-days: 90
          path: |
            release.json
            release-values.json
