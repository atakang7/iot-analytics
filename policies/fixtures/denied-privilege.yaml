apiVersion: v1
kind: Pod
metadata:
  name: iot-policy-denied-privilege
spec:
  containers:
    - name: probe
      image: busybox:1.36
      command: ["true"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
        capabilities:
          add: ["NET_ADMIN"]
