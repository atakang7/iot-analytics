apiVersion: v1
kind: Pod
metadata:
  name: iot-policy-allowed
spec:
  restartPolicy: Never
  containers:
    - name: probe
      image: busybox:1.36
      command: ["true"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
